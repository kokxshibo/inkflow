# InkFlow — __DOMAIN__
# Installé par deploy/setup-vps.sh ; certbot y ajoute ensuite le bloc HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    include snippets/durcissement.conf;
    limit_conn parip 40;

    # Formulaire de demande avec photos de référence (Server Actions : 12 Mo).
    client_max_body_size 15m;

    # Fichiers envoyés (photos de référence, photos de profil Instagram) :
    # servis directement, Next ne sert pas ce qui est ajouté après le build.
    location /uploads/ {
        alias /var/lib/inkflow/uploads/;
        # Un add_header dans ce bloc annule ceux du serveur : on les répète.
        include snippets/durcissement.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Analyse IA d'une facture (Gemini) : quelques secondes, parfois plus.
        proxy_read_timeout 120s;
    }
}
